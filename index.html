<!DOCTYPE html>
<html lang="en">
<head>
  <title>Ahri Food List</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="food-container">
    <div class="food-add-container">
      <form id="food-form">
        <label for="food-text-input">Your favourite food</label>
        <input
          type="text"
          id="food-text-input"
          name="food-text"
          placeholder="e.g. Pizza"
          required
        />

        <label for="food-file-input" class="file-label">Upload food photo</label>
        <input
          type="file"
          id="food-file-input"
          name="food-file"
          accept="image/*"
          required
        />

        <button id="addBtn" type="submit">ADD</button>
      </form>
    </div>

    <div class="food-items" id="food-list">
      <div class="food-item">
        <img src="tango.avif" alt="Placeholder food" />
        <div>
          <p class="food-name">tango</p>
          <p class="food-rating">⭐ 5/5</p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
